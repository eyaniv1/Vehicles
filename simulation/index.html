<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Braitenberg Vehicle Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #controls {
    width: 280px;
    padding: 16px;
    background: #16213e;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  #controls h1 { font-size: 18px; color: #e0e0e0; margin-bottom: 2px; }

  #controls h2 {
    font-size: 12px;
    color: #8888aa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .slider-row label {
    font-size: 12px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }

  .slider-row label span { color: #4fc3f7; }

  input[type="range"] {
    width: 100%;
    accent-color: #4fc3f7;
  }

  .btn {
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: all 0.15s;
  }

  .btn-reset { background: #333; color: #aaa; }
  .btn-reset:hover { background: #444; }
  .btn-stop { background: #c62828; color: #fff; }
  .btn-stop.stopped { background: #2e7d32; color: #fff; }

  .btn-add {
    background: #1565c0;
    color: #fff;
    width: 100%;
  }
  .btn-add:hover { background: #1976d2; }

  .btn-preset {
    background: #6a1b9a;
    color: #fff;
    width: 100%;
    font-size: 12px;
  }
  .btn-preset:hover { background: #7b1fa2; }

  .btn-row {
    display: flex;
    gap: 6px;
  }
  .btn-row .btn { flex: 1; }

  /* Vehicle cards */
  .vehicle-card {
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .vehicle-card:hover { border-color: #555; }
  .vehicle-card.selected { border-color: #4fc3f7; background: #1a2a4e; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .color-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-header select {
    flex: 1;
    background: #16213e;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 3px 4px;
    font-size: 12px;
    cursor: pointer;
  }

  .card-delete {
    background: none;
    border: none;
    color: #666;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .card-delete:hover { color: #c62828; }

  .card-light {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
  }

  .card-light input[type="checkbox"] {
    accent-color: #ffd54f;
    cursor: pointer;
  }

  .card-light input[type="range"] {
    flex: 1;
    accent-color: #ffd54f;
    height: 14px;
  }

  .card-light .light-val {
    color: #ffd54f;
    font-weight: bold;
    width: 30px;
    text-align: right;
    font-size: 11px;
  }

  .card-slider {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
  }

  .card-slider input[type="range"] {
    flex: 1;
    height: 14px;
  }

  .card-slider .slider-val {
    color: #4fc3f7;
    font-weight: bold;
    width: 30px;
    text-align: right;
    font-size: 11px;
  }

  #vehicle-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Readout */
  .sensor-readout {
    display: flex;
    gap: 8px;
    font-size: 11px;
  }

  .sensor-readout div {
    flex: 1;
    padding: 4px 6px;
    background: #1a1a2e;
    border-radius: 6px;
    text-align: center;
  }

  .sensor-readout .label { color: #888; font-size: 9px; }
  .sensor-readout .value { color: #4fc3f7; font-weight: bold; font-size: 14px; }
  .motor-l .value { color: #ff8a65; }
  .motor-r .value { color: #81c784; }

  .readout-vehicle-name {
    font-size: 11px;
    color: #666;
    text-align: center;
    margin-bottom: 4px;
  }

  #canvas-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  canvas {
    border-radius: 12px;
    cursor: crosshair;
  }

  .info-text {
    font-size: 10px;
    color: #555;
    line-height: 1.4;
  }

  /* Light intensity popup */
  #intensity-popup {
    display: none;
    position: absolute;
    background: #16213e;
    border: 1px solid #4fc3f7;
    border-radius: 8px;
    padding: 10px 14px;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  #intensity-popup label {
    font-size: 12px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  #intensity-popup label span { color: #4fc3f7; font-weight: bold; }

  #intensity-popup input[type="range"] { width: 120px; }

  #intensity-popup .popup-delete {
    margin-top: 8px;
    padding: 4px 8px;
    background: #c62828;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    width: 100%;
  }
  #intensity-popup .popup-delete:hover { background: #e53935; }
</style>
</head>
<body>

<div id="controls">
  <h1>Braitenberg Vehicles</h1>

  <h2>Simulation</h2>
  <div class="btn-row">
    <button class="btn btn-stop" id="stop-btn">Stop All</button>
    <button class="btn btn-reset" id="reset-btn">Reset All</button>
  </div>

  <h2>Vehicles</h2>
  <button class="btn btn-add" id="add-vehicle-btn">+ Add Vehicle</button>
  <button class="btn btn-preset" id="social-btn">Social Mode: Lights + Side Fear</button>
  <div id="vehicle-list"></div>

  <h2>Selected Vehicle</h2>
  <div class="readout-vehicle-name" id="readout-name">--</div>
  <div class="sensor-readout">
    <div>
      <div class="label">Left Eye</div>
      <div class="value" id="sensor-l">0</div>
    </div>
    <div>
      <div class="label">Right Eye</div>
      <div class="value" id="sensor-r">0</div>
    </div>
  </div>
  <div class="sensor-readout" style="margin-top: 4px;" id="side-readout">
    <div>
      <div class="label">Side L</div>
      <div class="value" id="sensor-sl">0</div>
    </div>
    <div>
      <div class="label">Side R</div>
      <div class="value" id="sensor-sr">0</div>
    </div>
  </div>
  <div class="sensor-readout" style="margin-top: 4px;">
    <div class="motor-l">
      <div class="label">Left Motor</div>
      <div class="value" id="motor-l">0</div>
    </div>
    <div class="motor-r">
      <div class="label">Right Motor</div>
      <div class="value" id="motor-r">0</div>
    </div>
  </div>

  <h2>Static Lights</h2>
  <p class="info-text">
    Double-click canvas to add a light.<br>
    Click light to toggle. Drag to move.<br>
    Right-click for intensity / delete.
  </p>
</div>

<div id="canvas-container">
  <canvas id="canvas"></canvas>
  <div id="intensity-popup">
    <label>Intensity <span id="popup-intensity-value">75%</span></label>
    <input type="range" id="popup-intensity-slider" min="10" max="100" value="75">
    <button class="popup-delete" id="popup-delete-btn">Delete Light</button>
  </div>
</div>

<script>
// --- Vehicle type definitions ---
const VEHICLE_TYPES = [
  { id: 'v1',  name: 'V1 — Getting Around', shortName: 'V1 Wander',
    sensors: 1, crossed: false, inhibitory: false },
  { id: 'v2a', name: 'V2a — Fear', shortName: 'V2a Fear',
    sensors: 2, crossed: false, inhibitory: false },
  { id: 'v2b', name: 'V2b — Aggression', shortName: 'V2b Aggression',
    sensors: 2, crossed: true, inhibitory: false },
  { id: 'v3a', name: 'V3a — Love', shortName: 'V3a Love',
    sensors: 2, crossed: false, inhibitory: true },
  { id: 'v3b', name: 'V3b — Explorer', shortName: 'V3b Explorer',
    sensors: 2, crossed: true, inhibitory: true },
];

// --- Color palette for vehicles ---
const VEHICLE_COLORS = [
  { body: '#2a4a7f', stroke: '#4a7abf', r: 100, g: 180, b: 255 },
  { body: '#7f2a4a', stroke: '#bf4a7a', r: 255, g: 100, b: 180 },
  { body: '#2a7f4a', stroke: '#4abf7a', r: 100, g: 255, b: 180 },
  { body: '#7f6a2a', stroke: '#bfa04a', r: 255, g: 220, b: 100 },
  { body: '#5a2a7f', stroke: '#8a4abf', r: 180, g: 100, b: 255 },
  { body: '#2a6a7f', stroke: '#4aafbf', r: 100, g: 220, b: 255 },
  { body: '#7f4a2a', stroke: '#bf7a4a', r: 255, g: 160, b: 100 },
  { body: '#4a7f2a', stroke: '#7abf4a', r: 180, g: 255, b: 100 },
];

// --- Static light sources ---
let nextLightId = 1;
let staticLights = [];

function createStaticLight(x, y) {
  const light = { id: nextLightId++, x, y, on: true, intensity: 75 };
  staticLights.push(light);
  return light;
}

function staticLightAt(x, y) {
  const GRAB_RADIUS = 18;
  for (let i = staticLights.length - 1; i >= 0; i--) {
    const l = staticLights[i];
    const dx = x - l.x, dy = y - l.y;
    if (dx * dx + dy * dy < GRAB_RADIUS * GRAB_RADIUS) return l;
  }
  return null;
}

// --- Vehicle instances ---
let nextVehicleId = 1;
let vehicles = [];
let selectedVehicleId = null;
let colorIndex = 0;

function createVehicle(typeIndex) {
  const color = VEHICLE_COLORS[colorIndex % VEHICLE_COLORS.length];
  colorIndex++;
  const v = {
    id: nextVehicleId++,
    typeIndex: typeIndex || 0,
    x: 100 + Math.random() * (canvas.width - 200),
    y: 100 + Math.random() * (canvas.height - 200),
    theta: Math.random() * Math.PI * 2,
    trail: [],
    leftSpeed: 0,
    rightSpeed: 0,
    wheelRotation: 0,
    color: color,
    light: { on: false, intensity: 50 },
    sidePair: { enabled: false, behaviorIndex: 0, weight: 50 },
    simSpeed: 1,
    speedContrast: 50,
  };
  vehicles.push(v);
  if (!selectedVehicleId) selectedVehicleId = v.id;
  return v;
}

function removeVehicle(id) {
  vehicles = vehicles.filter(v => v.id !== id);
  if (selectedVehicleId === id) {
    selectedVehicleId = vehicles.length > 0 ? vehicles[0].id : null;
  }
}

function getVehicleType(v) {
  return VEHICLE_TYPES[v.typeIndex];
}

// --- Global state ---
let stopped = false;

// --- Canvas setup ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('canvas-container');
  canvas.width = Math.min(container.clientWidth - 40, 1200);
  canvas.height = Math.min(container.clientHeight - 40, 800);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Vehicle geometry ---
const VEHICLE_LENGTH = 50;
const VEHICLE_WIDTH = 34;
const SENSOR_SPREAD = 18;
const SENSOR_FORWARD = 30;
const SIDE_SENSOR_OFFSET = VEHICLE_WIDTH / 2 + 4; // how far out from center
const WHEEL_BASE = VEHICLE_WIDTH;

// Side pair behavior options
const SIDE_BEHAVIORS = [
  { name: 'Fear', crossed: false, inhibitory: false },
  { name: 'Aggression', crossed: true, inhibitory: false },
  { name: 'Love', crossed: false, inhibitory: true },
  { name: 'Explorer', crossed: true, inhibitory: true },
];

// --- Sensor calculation ---
function getFrontSensorPositions(v) {
  const cosT = Math.cos(v.theta);
  const sinT = Math.sin(v.theta);
  return {
    leftX:  v.x + cosT * SENSOR_FORWARD + sinT * SENSOR_SPREAD,
    leftY:  v.y + sinT * SENSOR_FORWARD - cosT * SENSOR_SPREAD,
    rightX: v.x + cosT * SENSOR_FORWARD - sinT * SENSOR_SPREAD,
    rightY: v.y + sinT * SENSOR_FORWARD + cosT * SENSOR_SPREAD,
  };
}

function getSideSensorPositions(v) {
  const cosT = Math.cos(v.theta);
  const sinT = Math.sin(v.theta);
  // Left side sensor: perpendicular left from vehicle center (y-down canvas)
  // Right side sensor: perpendicular right
  return {
    leftX:  v.x + sinT * SIDE_SENSOR_OFFSET,
    leftY:  v.y - cosT * SIDE_SENSOR_OFFSET,
    rightX: v.x - sinT * SIDE_SENSOR_OFFSET,
    rightY: v.y + cosT * SIDE_SENSOR_OFFSET,
  };
}

// Combined intensity from all light sources at a point, excluding a specific vehicle's own light
function totalIntensityAt(px, py, excludeVehicleId) {
  let sum = 0;

  // Static lights
  for (const light of staticLights) {
    if (!light.on) continue;
    const dx = px - light.x;
    const dy = py - light.y;
    const distSq = dx * dx + dy * dy;
    const minDist = 20;
    const effectiveDist = Math.max(distSq, minDist * minDist);
    sum += (light.intensity / 75) * 80000 / effectiveDist;
  }

  // Vehicle-mounted lights (exclude self)
  for (const v of vehicles) {
    if (v.id === excludeVehicleId) continue;
    if (!v.light.on) continue;
    const dx = px - v.x;
    const dy = py - v.y;
    const distSq = dx * dx + dy * dy;
    const minDist = 20;
    const effectiveDist = Math.max(distSq, minDist * minDist);
    sum += (v.light.intensity / 75) * 80000 / effectiveDist;
  }

  return sum / (1 + sum);
}

// Compute motor outputs for a sensor pair given wiring config
function computePairMotors(rawL, rawR, sensorCount, crossed, inhibitory) {
  let leftInput, rightInput;
  if (sensorCount === 1) {
    const combined = (rawL + rawR) / 2;
    leftInput = combined;
    rightInput = combined;
  } else if (crossed) {
    leftInput = rawR;
    rightInput = rawL;
  } else {
    leftInput = rawL;
    rightInput = rawR;
  }

  if (inhibitory) {
    return { left: 1 - leftInput, right: 1 - rightInput };
  } else {
    const baseSpeed = 0.15;
    return {
      left: baseSpeed + (1 - baseSpeed) * leftInput,
      right: baseSpeed + (1 - baseSpeed) * rightInput,
    };
  }
}

// --- Physics step for one vehicle ---
function stepVehicle(v, dt) {
  const frontSensors = getFrontSensorPositions(v);
  const rawFrontL = totalIntensityAt(frontSensors.leftX, frontSensors.leftY, v.id);
  const rawFrontR = totalIntensityAt(frontSensors.rightX, frontSensors.rightY, v.id);

  const type = getVehicleType(v);
  const front = computePairMotors(rawFrontL, rawFrontR, type.sensors, type.crossed, type.inhibitory);

  let leftSpeed, rightSpeed;

  if (v.sidePair.enabled) {
    const sideSensors = getSideSensorPositions(v);
    const rawSideL = totalIntensityAt(sideSensors.leftX, sideSensors.leftY, v.id);
    const rawSideR = totalIntensityAt(sideSensors.rightX, sideSensors.rightY, v.id);
    const sideBeh = SIDE_BEHAVIORS[v.sidePair.behaviorIndex];
    const side = computePairMotors(rawSideL, rawSideR, 2, sideBeh.crossed, sideBeh.inhibitory);

    const w = v.sidePair.weight / 100;
    leftSpeed = (1 - w) * front.left + w * side.left;
    rightSpeed = (1 - w) * front.right + w * side.right;

    // Store side readings for readout
    v._sideL = rawSideL;
    v._sideR = rawSideR;
  } else {
    leftSpeed = front.left;
    rightSpeed = front.right;
  }

  v.leftSpeed = leftSpeed;
  v.rightSpeed = rightSpeed;
  v.wheelRotation += (leftSpeed + rightSpeed) / 2 * dt * 10;

  const maxPixelsPerSec = 180;
  const exp = 1 + (v.speedContrast / 50);
  const vl = Math.pow(leftSpeed, exp) * maxPixelsPerSec;
  const vr = Math.pow(rightSpeed, exp) * maxPixelsPerSec;

  const linearV = (vl + vr) / 2;
  const angularV = (vl - vr) / WHEEL_BASE;

  v.x += linearV * Math.cos(v.theta) * dt;
  v.y += linearV * Math.sin(v.theta) * dt;
  v.theta += angularV * dt;

  // Bounce off walls
  const margin = VEHICLE_LENGTH / 2;
  if (v.x < margin) {
    v.x = margin;
    v.theta = Math.PI - v.theta;
  } else if (v.x > canvas.width - margin) {
    v.x = canvas.width - margin;
    v.theta = Math.PI - v.theta;
  }
  if (v.y < margin) {
    v.y = margin;
    v.theta = -v.theta;
  } else if (v.y > canvas.height - margin) {
    v.y = canvas.height - margin;
    v.theta = -v.theta;
  }

  v.trail.push({ x: v.x, y: v.y });
  if (v.trail.length > 500) v.trail.shift();

  // Update readout for selected vehicle
  if (v.id === selectedVehicleId) {
    document.getElementById('sensor-l').textContent = (rawFrontL * 100).toFixed(0);
    document.getElementById('sensor-r').textContent = (rawFrontR * 100).toFixed(0);
    document.getElementById('motor-l').textContent = (leftSpeed * 100).toFixed(0);
    document.getElementById('motor-r').textContent = (rightSpeed * 100).toFixed(0);
    const sideReadout = document.getElementById('side-readout');
    if (v.sidePair.enabled) {
      sideReadout.style.display = '';
      document.getElementById('sensor-sl').textContent = (v._sideL * 100).toFixed(0);
      document.getElementById('sensor-sr').textContent = (v._sideR * 100).toFixed(0);
    } else {
      sideReadout.style.display = 'none';
    }
  }
}

// --- Drawing ---
function drawLightGradients() {
  // Static lights
  for (const light of staticLights) {
    const radius = 250 * (light.intensity / 75);
    const alpha = light.on ? 0.15 : 0.03;
    const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, radius);
    grad.addColorStop(0, `rgba(255, 235, 100, ${alpha})`);
    grad.addColorStop(1, 'rgba(255, 235, 100, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  // Vehicle-mounted lights
  for (const v of vehicles) {
    if (!v.light.on) continue;
    const radius = 200 * (v.light.intensity / 75);
    const grad = ctx.createRadialGradient(v.x, v.y, 0, v.x, v.y, radius);
    grad.addColorStop(0, 'rgba(255, 235, 100, 0.1)');
    grad.addColorStop(1, 'rgba(255, 235, 100, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function drawStaticLights() {
  for (const light of staticLights) {
    const glowRadius = light.on ? 16 : 8;
    const color = light.on ? '#ffd54f' : '#555';

    if (light.on) {
      const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, glowRadius * 2);
      grad.addColorStop(0, 'rgba(255, 213, 79, 0.4)');
      grad.addColorStop(1, 'rgba(255, 213, 79, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(light.x, light.y, glowRadius * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(light.x, light.y, 8, 0, Math.PI * 2);
    ctx.fill();

    if (light.on) {
      ctx.strokeStyle = 'rgba(255, 213, 79, 0.5)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(light.x + Math.cos(angle) * 12, light.y + Math.sin(angle) * 12);
        ctx.lineTo(light.x + Math.cos(angle) * 18, light.y + Math.sin(angle) * 18);
        ctx.stroke();
      }
    }
  }
}

function drawTrail(v) {
  if (v.trail.length < 2) return;
  const c = v.color;
  ctx.lineWidth = 1.5;
  for (let i = 1; i < v.trail.length; i++) {
    const alpha = i / v.trail.length * 0.4;
    ctx.strokeStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(v.trail[i - 1].x, v.trail[i - 1].y);
    ctx.lineTo(v.trail[i].x, v.trail[i].y);
    ctx.stroke();
  }
}

function drawVehicle(v) {
  const type = getVehicleType(v);
  const isSelected = v.id === selectedVehicleId;

  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.rotate(v.theta);

  // Body
  ctx.fillStyle = v.color.body;
  ctx.strokeStyle = isSelected ? '#fff' : v.color.stroke;
  ctx.lineWidth = isSelected ? 3 : 2;
  ctx.beginPath();
  ctx.roundRect(-VEHICLE_LENGTH / 2, -VEHICLE_WIDTH / 2, VEHICLE_LENGTH, VEHICLE_WIDTH, 4);
  ctx.fill();
  ctx.stroke();

  // Direction arrow
  ctx.fillStyle = v.color.stroke;
  ctx.beginPath();
  ctx.moveTo(VEHICLE_LENGTH / 2, -6);
  ctx.lineTo(VEHICLE_LENGTH / 2 + 10, 0);
  ctx.lineTo(VEHICLE_LENGTH / 2, 6);
  ctx.fill();

  // Mounted light indicator
  if (v.light.on) {
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 16);
    glow.addColorStop(0, `rgba(255, 213, 79, ${0.2 + 0.3 * v.light.intensity / 100})`);
    glow.addColorStop(1, 'rgba(255, 213, 79, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Wheels
  const wheelW = VEHICLE_LENGTH / 2.2;
  const wheelH = 8;
  const wheelXPos = -VEHICLE_LENGTH / 3;

  function wheelColor(speed) {
    const r = Math.floor(80 + 175 * speed);
    const g = Math.floor(60 + 100 * (1 - speed));
    const b = Math.floor(40 + 60 * (1 - speed));
    return `rgb(${r}, ${g}, ${b})`;
  }

  const tickCount = 4;

  // Left wheel
  const leftWheelY = -VEHICLE_WIDTH / 2 - wheelH;
  ctx.fillStyle = wheelColor(v.leftSpeed);
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.fillRect(wheelXPos, leftWheelY, wheelW, wheelH);
  ctx.strokeRect(wheelXPos, leftWheelY, wheelW, wheelH);
  const leftRotOffset = v.wheelRotation * v.leftSpeed;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < tickCount; i++) {
    const t = ((i / tickCount) + leftRotOffset) % 1;
    const tx = wheelXPos + t * wheelW;
    ctx.beginPath(); ctx.moveTo(tx, leftWheelY); ctx.lineTo(tx, leftWheelY + wheelH); ctx.stroke();
  }

  // Right wheel
  const rightWheelY = VEHICLE_WIDTH / 2;
  ctx.fillStyle = wheelColor(v.rightSpeed);
  ctx.strokeStyle = '#888';
  ctx.fillRect(wheelXPos, rightWheelY, wheelW, wheelH);
  ctx.strokeRect(wheelXPos, rightWheelY, wheelW, wheelH);
  const rightRotOffset = v.wheelRotation * v.rightSpeed;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < tickCount; i++) {
    const t = ((i / tickCount) + rightRotOffset) % 1;
    const tx = wheelXPos + t * wheelW;
    ctx.beginPath(); ctx.moveTo(tx, rightWheelY); ctx.lineTo(tx, rightWheelY + wheelH); ctx.stroke();
  }

  // Front sensors and wiring
  const frontSensors = getFrontSensorPositions(v);
  const leftReading = totalIntensityAt(frontSensors.leftX, frontSensors.leftY, v.id);
  const rightReading = totalIntensityAt(frontSensors.rightX, frontSensors.rightY, v.id);
  const avgReading = (leftReading + rightReading) / 2;

  const wheelY_left = -VEHICLE_WIDTH / 2 - 2;
  const wheelY_right = VEHICLE_WIDTH / 2 + 2;
  const wheelX = -VEHICLE_LENGTH / 4;

  if (type.sensors === 1) {
    const bright = 0.3 + 0.7 * avgReading;
    ctx.fillStyle = `rgba(255, 255, 255, ${bright})`;
    ctx.beginPath();
    ctx.arc(SENSOR_FORWARD, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';
    ctx.beginPath();
    ctx.moveTo(SENSOR_FORWARD, 0);
    ctx.lineTo(2, 0);
    ctx.moveTo(2, 0);
    ctx.lineTo(wheelX, wheelY_left);
    ctx.moveTo(2, 0);
    ctx.lineTo(wheelX, wheelY_right);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    const leftBright = 0.3 + 0.7 * leftReading;
    const rightBright = 0.3 + 0.7 * rightReading;

    ctx.fillStyle = `rgba(255, 255, 255, ${leftBright})`;
    ctx.beginPath();
    ctx.arc(SENSOR_FORWARD, -SENSOR_SPREAD, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = `rgba(255, 255, 255, ${rightBright})`;
    ctx.beginPath();
    ctx.arc(SENSOR_FORWARD, SENSOR_SPREAD, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';

    if (type.crossed) {
      ctx.beginPath();
      ctx.moveTo(SENSOR_FORWARD, -SENSOR_SPREAD);
      ctx.lineTo(wheelX, wheelY_right);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(SENSOR_FORWARD, SENSOR_SPREAD);
      ctx.lineTo(wheelX, wheelY_left);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(SENSOR_FORWARD, -SENSOR_SPREAD);
      ctx.lineTo(wheelX, wheelY_left);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(SENSOR_FORWARD, SENSOR_SPREAD);
      ctx.lineTo(wheelX, wheelY_right);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // Side sensors (if enabled)
  if (v.sidePair.enabled) {
    const sideSensors = getSideSensorPositions(v);
    const sideL = totalIntensityAt(sideSensors.leftX, sideSensors.leftY, v.id);
    const sideR = totalIntensityAt(sideSensors.rightX, sideSensors.rightY, v.id);
    const sideBeh = SIDE_BEHAVIORS[v.sidePair.behaviorIndex];

    // Side sensor dots (on left and right sides of body)
    const sideY_left = -SIDE_SENSOR_OFFSET;
    const sideY_right = SIDE_SENSOR_OFFSET;

    const sLeftBright = 0.3 + 0.7 * sideL;
    ctx.fillStyle = `rgba(180, 255, 180, ${sLeftBright})`;
    ctx.beginPath();
    ctx.arc(0, sideY_left, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180, 255, 180, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const sRightBright = 0.3 + 0.7 * sideR;
    ctx.fillStyle = `rgba(180, 255, 180, ${sRightBright})`;
    ctx.beginPath();
    ctx.arc(0, sideY_right, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180, 255, 180, 0.5)';
    ctx.stroke();

    // Side wiring lines (green-tinted)
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(100, 255, 150, 0.4)';

    if (sideBeh.crossed) {
      ctx.beginPath();
      ctx.moveTo(0, sideY_left);
      ctx.lineTo(wheelX, wheelY_right);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, sideY_right);
      ctx.lineTo(wheelX, wheelY_left);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, sideY_left);
      ctx.lineTo(wheelX, wheelY_left);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, sideY_right);
      ctx.lineTo(wheelX, wheelY_right);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#1a1a33';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  drawLightGradients();
  for (const v of vehicles) drawTrail(v);
  drawStaticLights();
  for (const v of vehicles) drawVehicle(v);
}

// --- Game loop ---
let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const rawDt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  const baseDt = Math.min(rawDt, 0.05);
  if (!stopped) {
    for (const v of vehicles) stepVehicle(v, baseDt * v.simSpeed);
  }
  draw();
  requestAnimationFrame(loop);
}

// --- UI: Vehicle list ---
function buildVehicleCards() {
  const container = document.getElementById('vehicle-list');
  container.innerHTML = '';

  for (const v of vehicles) {
    const card = document.createElement('div');
    card.className = 'vehicle-card' + (v.id === selectedVehicleId ? ' selected' : '');
    card.dataset.vehicleId = v.id;

    // Header row: color dot + type select + delete
    const header = document.createElement('div');
    header.className = 'card-header';

    const dot = document.createElement('span');
    dot.className = 'color-dot';
    dot.style.background = v.color.stroke;

    const select = document.createElement('select');
    VEHICLE_TYPES.forEach((type, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = type.shortName;
      if (i === v.typeIndex) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', (e) => {
      e.stopPropagation();
      v.typeIndex = parseInt(e.target.value);
      updateReadoutName();
    });

    const del = document.createElement('button');
    del.className = 'card-delete';
    del.textContent = '\u00d7';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      removeVehicle(v.id);
      buildVehicleCards();
      updateReadoutName();
    });

    header.appendChild(dot);
    header.appendChild(select);
    header.appendChild(del);

    // Light row: checkbox + slider + value
    const lightRow = document.createElement('div');
    lightRow.className = 'card-light';

    const lightLabel = document.createElement('span');
    lightLabel.textContent = 'Light';

    const lightCheck = document.createElement('input');
    lightCheck.type = 'checkbox';
    lightCheck.checked = v.light.on;
    lightCheck.addEventListener('change', (e) => {
      e.stopPropagation();
      v.light.on = e.target.checked;
    });

    const lightSlider = document.createElement('input');
    lightSlider.type = 'range';
    lightSlider.min = 10;
    lightSlider.max = 100;
    lightSlider.value = v.light.intensity;
    lightSlider.addEventListener('input', (e) => {
      e.stopPropagation();
      v.light.intensity = parseInt(e.target.value);
      lightVal.textContent = v.light.intensity + '%';
    });

    const lightVal = document.createElement('span');
    lightVal.className = 'light-val';
    lightVal.textContent = v.light.intensity + '%';

    lightRow.appendChild(lightLabel);
    lightRow.appendChild(lightCheck);
    lightRow.appendChild(lightSlider);
    lightRow.appendChild(lightVal);

    // Speed row
    const speedRow = document.createElement('div');
    speedRow.className = 'card-slider';
    const speedLabel = document.createElement('span');
    speedLabel.textContent = 'Speed';
    const speedSlider = document.createElement('input');
    speedSlider.type = 'range';
    speedSlider.min = 1;
    speedSlider.max = 5;
    speedSlider.value = v.simSpeed;
    const speedVal = document.createElement('span');
    speedVal.className = 'slider-val';
    speedVal.textContent = v.simSpeed + 'x';
    speedSlider.addEventListener('input', (e) => {
      e.stopPropagation();
      v.simSpeed = parseInt(e.target.value);
      speedVal.textContent = v.simSpeed + 'x';
    });
    speedRow.appendChild(speedLabel);
    speedRow.appendChild(speedSlider);
    speedRow.appendChild(speedVal);

    // Contrast row
    const contrastRow = document.createElement('div');
    contrastRow.className = 'card-slider';
    const contrastLabel = document.createElement('span');
    contrastLabel.textContent = 'Contrast';
    const contrastSlider = document.createElement('input');
    contrastSlider.type = 'range';
    contrastSlider.min = 0;
    contrastSlider.max = 100;
    contrastSlider.value = v.speedContrast;
    const contrastVal = document.createElement('span');
    contrastVal.className = 'slider-val';
    contrastVal.textContent = v.speedContrast + '%';
    contrastSlider.addEventListener('input', (e) => {
      e.stopPropagation();
      v.speedContrast = parseInt(e.target.value);
      contrastVal.textContent = v.speedContrast + '%';
    });
    contrastRow.appendChild(contrastLabel);
    contrastRow.appendChild(contrastSlider);
    contrastRow.appendChild(contrastVal);

    // Side pair row: enable checkbox + behavior select
    const sideRow = document.createElement('div');
    sideRow.className = 'card-light';
    const sideLabel = document.createElement('span');
    sideLabel.textContent = 'Side';
    const sideCheck = document.createElement('input');
    sideCheck.type = 'checkbox';
    sideCheck.checked = v.sidePair.enabled;
    const sideSelect = document.createElement('select');
    sideSelect.style.cssText = 'flex:1; background:#16213e; color:#e0e0e0; border:1px solid #444; border-radius:4px; padding:2px 3px; font-size:11px;';
    SIDE_BEHAVIORS.forEach((beh, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = beh.name;
      if (i === v.sidePair.behaviorIndex) opt.selected = true;
      sideSelect.appendChild(opt);
    });
    sideCheck.addEventListener('change', (e) => {
      e.stopPropagation();
      v.sidePair.enabled = e.target.checked;
    });
    sideSelect.addEventListener('change', (e) => {
      e.stopPropagation();
      v.sidePair.behaviorIndex = parseInt(e.target.value);
    });
    sideRow.appendChild(sideLabel);
    sideRow.appendChild(sideCheck);
    sideRow.appendChild(sideSelect);

    // Side blend weight row
    const blendRow = document.createElement('div');
    blendRow.className = 'card-slider';
    const blendLabel = document.createElement('span');
    blendLabel.textContent = 'Blend';
    const blendSlider = document.createElement('input');
    blendSlider.type = 'range';
    blendSlider.min = 0;
    blendSlider.max = 100;
    blendSlider.value = v.sidePair.weight;
    const blendVal = document.createElement('span');
    blendVal.className = 'slider-val';
    blendVal.textContent = v.sidePair.weight + '%';
    blendSlider.addEventListener('input', (e) => {
      e.stopPropagation();
      v.sidePair.weight = parseInt(e.target.value);
      blendVal.textContent = v.sidePair.weight + '%';
    });
    blendRow.appendChild(blendLabel);
    blendRow.appendChild(blendSlider);
    blendRow.appendChild(blendVal);

    card.appendChild(header);
    card.appendChild(lightRow);
    card.appendChild(speedRow);
    card.appendChild(contrastRow);
    card.appendChild(sideRow);
    card.appendChild(blendRow);

    // Click card to select vehicle
    card.addEventListener('click', () => {
      selectedVehicleId = v.id;
      document.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      updateReadoutName();
    });

    container.appendChild(card);
  }
}

function updateReadoutName() {
  const el = document.getElementById('readout-name');
  const v = vehicles.find(v => v.id === selectedVehicleId);
  if (v) {
    const type = getVehicleType(v);
    el.textContent = type.shortName;
    el.style.color = v.color.stroke;
  } else {
    el.textContent = '--';
    el.style.color = '#666';
  }
}

// --- UI: Controls ---
document.getElementById('stop-btn').addEventListener('click', () => {
  stopped = !stopped;
  const btn = document.getElementById('stop-btn');
  btn.textContent = stopped ? 'Start All' : 'Stop All';
  btn.className = 'btn ' + (stopped ? 'btn-stop stopped' : 'btn-stop');
});

document.getElementById('reset-btn').addEventListener('click', () => {
  for (const v of vehicles) {
    v.x = 100 + Math.random() * (canvas.width - 200);
    v.y = 100 + Math.random() * (canvas.height - 200);
    v.theta = Math.random() * Math.PI * 2;
    v.trail = [];
  }
});

document.getElementById('add-vehicle-btn').addEventListener('click', () => {
  createVehicle(0);
  buildVehicleCards();
  updateReadoutName();
});

document.getElementById('social-btn').addEventListener('click', () => {
  for (const v of vehicles) {
    v.light.on = true;
    v.light.intensity = 50;
    v.sidePair.enabled = true;
    v.sidePair.behaviorIndex = 0; // Fear
    v.sidePair.weight = 25;
  }
  buildVehicleCards();
});

// --- Canvas interaction: static lights ---
let dragging = null;
let dragStarted = false;
let mouseDownPos = null;

const popup = document.getElementById('intensity-popup');
const popupSlider = document.getElementById('popup-intensity-slider');
const popupValue = document.getElementById('popup-intensity-value');
const popupDeleteBtn = document.getElementById('popup-delete-btn');
let popupLight = null;

function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function closePopup() {
  popup.style.display = 'none';
  popupLight = null;
}

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  closePopup();
  const pos = canvasCoords(e);
  mouseDownPos = pos;
  const hit = staticLightAt(pos.x, pos.y);
  if (hit) {
    dragging = hit;
    dragStarted = false;
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const pos = canvasCoords(e);
  const dx = pos.x - mouseDownPos.x;
  const dy = pos.y - mouseDownPos.y;
  if (!dragStarted && (dx * dx + dy * dy > 9)) dragStarted = true;
  if (dragStarted) {
    dragging.x = pos.x;
    dragging.y = pos.y;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;
  if (dragging && !dragStarted) {
    dragging.on = !dragging.on;
  }
  dragging = null;
  dragStarted = false;
});

canvas.addEventListener('dblclick', (e) => {
  const pos = canvasCoords(e);
  if (!staticLightAt(pos.x, pos.y)) {
    createStaticLight(pos.x, pos.y);
  }
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const pos = canvasCoords(e);
  const hit = staticLightAt(pos.x, pos.y);
  if (hit) {
    popupLight = hit;
    popupSlider.value = hit.intensity;
    popupValue.textContent = hit.intensity + '%';
    const rect = canvas.getBoundingClientRect();
    const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
    popup.style.left = (rect.left - containerRect.left + pos.x + 20) + 'px';
    popup.style.top = (rect.top - containerRect.top + pos.y - 30) + 'px';
    popup.style.display = 'block';
  } else {
    closePopup();
  }
});

popupSlider.addEventListener('input', () => {
  if (!popupLight) return;
  popupLight.intensity = parseInt(popupSlider.value);
  popupValue.textContent = popupLight.intensity + '%';
});

popupDeleteBtn.addEventListener('click', () => {
  if (!popupLight) return;
  staticLights = staticLights.filter(l => l !== popupLight);
  closePopup();
});

document.addEventListener('mousedown', (e) => {
  if (!popup.contains(e.target) && e.target !== canvas) closePopup();
});

// --- Init ---
createStaticLight(canvas.width * 0.65, canvas.height * 0.35);

// Create one default vehicle (V2b Aggression)
const defaultV = createVehicle(2);
defaultV.x = canvas.width * 0.3;
defaultV.y = canvas.height * 0.7;
defaultV.theta = -Math.PI / 4;

buildVehicleCards();
updateReadoutName();
requestAnimationFrame(loop);
</script>
</body>
